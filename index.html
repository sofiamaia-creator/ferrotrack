<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Ferrovias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">

    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
      <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6 col-xl-5">

          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">

              <div class="text-center mb-4">
                <img src="assets/img/logo.png" alt="Ferrovias" width="72" height="72" class="object-fit-contain mb-3">
                <h1 class="h3 mb-2">Seja bem-vindo!</h1>
                <p class="text-secondary mb-0">
                  Insira seu <strong>nome</strong> e <strong>senha</strong> para prosseguir
                </p>
              </div>

              <form>

                <div class="mb-3">
                  <label for="usuario" class="form-label">Nome de usuário</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="usuario" placeholder="Nome de usuário">
                  </div>
                </div>

                <div class="mb-2">
                  <label for="senha" class="form-label">Senha</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="senha" placeholder="Senha">
                  </div>
                </div>

                <div class="mb-4 text-end">
                  <a href="paginas/recuperar-senha.html" class="link-secondary small">Esqueceu sua senha?</a>
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                  <button type="button" class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-google"></i>
                    Continuar com Google
                  </button>
                </div>

              </form>

              <hr class="my-4">

              <p class="text-center mb-0 small">
                Ainda não tem conta?
                <a href="paginas/cadastro.html">Faça seu cadastro</a>
              </p>

            </div>
          </div>

        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
